<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Energy – Diagnóstico API</title>
<style>
  body { font-family: monospace; padding: 24px; background: #1c1c1e; color: #e5e5ea; }
  h2 { color: #0a84ff; }
  .ok  { color: #30d158; }
  .err { color: #ff453a; }
  .warn{ color: #ffd60a; }
  pre  { background:#2c2c2e; padding:12px; border-radius:8px; overflow:auto; font-size:13px; }
  button { background:#0a84ff; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-size:15px; }
</style>
</head>
<body>
<h2>🔍 Diagnóstico Energy Cargo API</h2>
<button onclick="runTests()">▶ Ejecutar pruebas</button>
<div id="output"></div>

<script>
function log(msg, cls='') {
  const d = document.getElementById('output');
  const p = document.createElement('p');
  p.style.margin = '4px 0';
  if (cls) p.style.color = cls === 'ok' ? '#30d158' : cls === 'err' ? '#ff453a' : '#ffd60a';
  p.innerHTML = msg;
  d.appendChild(p);
}
function pre(txt) {
  const d = document.getElementById('output');
  const p = document.createElement('pre');
  p.textContent = txt;
  d.appendChild(p);
}

async function runTests() {
  document.getElementById('output').innerHTML = '';
  log('<b>Test 1: Alcanzar api/sheets.php...</b>');
  
  try {
    const t0 = Date.now();
    const res = await fetch('api/sheets.php');
    const ms = Date.now() - t0;
    log(`→ HTTP ${res.status} ${res.statusText} (${ms}ms)`, res.ok ? 'ok' : 'err');
    log(`→ Content-Type: ${res.headers.get('content-type')}`, '');
    log(`→ X-Cache: ${res.headers.get('x-cache') || 'n/a'}`, '');
    log(`→ X-Total-Records: ${res.headers.get('x-total-records') || 'n/a'}`, '');
    
    const raw = await res.text();
    log('<b>Test 2: Respuesta raw (primeros 500 chars):</b>');
    pre(raw.slice(0, 500));
    
    log('<b>Test 3: Parsear JSON...</b>');
    try {
      const data = JSON.parse(raw);
      if (Array.isArray(data)) {
        log(`→ ✓ Array con ${data.length} registros`, 'ok');
        if (data.length > 0) {
          log('<b>Test 4: Primer registro (campos disponibles):</b>');
          pre(JSON.stringify(Object.keys(data[0]), null, 2));
          log('<b>Primer registro (valores):</b>');
          pre(JSON.stringify(data[0], null, 2));
        } else {
          log('→ ⚠ Array vacío - la hoja puede estar vacía o el nombre es incorrecto', 'warn');
        }
      } else {
        log(`→ ✗ No es array: ${JSON.stringify(data).slice(0,300)}`, 'err');
      }
    } catch(e) {
      log(`→ ✗ JSON parse error: ${e.message}`, 'err');
      log('Raw no es JSON válido - puede ser HTML de error PHP');
    }
    
  } catch(e) {
    log(`→ ✗ Fetch falló: ${e.message}`, 'err');
    log('Posibles causas: CORS, servidor caído, ruta incorrecta', 'warn');
  }
  
  log('<br><b>Test 5: Verificar elementos DOM esperados...</b>');
  const ids = ['loadingState','errorState','filterCount','lastUpdate'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    log(`→ #${id}: ${el ? '✓ existe' : '✗ no existe en esta página (normal)'}`, el ? 'ok' : '');
  });
}
</script>
</body>
</html>
